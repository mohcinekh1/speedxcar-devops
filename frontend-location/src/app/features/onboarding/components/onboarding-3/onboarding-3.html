<main class="onboarding-page">

  <div class="onboarding-overlay"></div>
  <div class="auth-brand">SpeedXcar</div>

  <section class="onboarding-content">
    <p class="step">03 / 03</p>
    <h1>Reservez en quelques clics</h1>
